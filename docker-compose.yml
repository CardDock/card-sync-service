services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: card-sync-service
    ports:
      - "3001:3001"
      - "9229:9229"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "pnpm prisma generate && pnpm start"]

volumes:
  node_modules:
